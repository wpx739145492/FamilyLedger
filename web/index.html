<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>添丁记</title>
<meta name="theme-color" content="#0d1017">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="添丁记">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="login" class="login-wrap">
  <h1 class="login-title">添丁记</h1>
  <p class="login-sub" id="loginSub">输入家庭口令</p>
  <input id="pin" class="pin" type="text" inputmode="numeric" autocomplete="one-time-code"
         maxlength="12" placeholder="••••••">
  <button id="btnLogin" class="btn btn-primary btn-login">进 入</button>
  <div id="loginErr" class="login-err"></div>
  <div id="memberGrid" class="member-grid"></div>
</div>

<!-- ============ 主体 ============ -->
<div id="main" class="hidden">
  <div id="offlineBar" class="offline-bar hidden"></div>
  <header class="hdr">
    <div class="hdr-in">
      <div>
        <div class="hdr-t" id="hdrTitle">添丁记</div>
        <div class="hdr-s" id="hdrSub">记录每一份心意</div>
      </div>
      <button class="icon-btn" id="btnExport" title="导出">↓</button>
    </div>
  </header>

  <div class="wrap">
    <!-- ---------- 首页：录入 + 洞察 ---------- -->
    <section id="page-home" class="page">
      <div id="insightBox"></div>

      <div class="quick">
        <div class="mode-switch" id="modeSwitch">
          <button class="mode on" data-mode="gift">人情往来</button>
          <button class="mode" data-mode="baby">宝宝开销</button>
        </div>

        <div class="field hidden" id="babyPickerWrap">
          <span class="field-lb">记在哪个宝宝名下</span>
          <select id="babyPicker" class="field-in baby-picker"></select>
        </div>

        <div class="field hidden" id="babyPickerWrap">
          <span class="field-lb">记在哪个宝宝名下</span>
          <select id="babyPicker" class="field-in baby-picker"></select>
        </div>

        <div class="amt-box">
          <div class="dir-switch" id="dirSwitch">
            <button class="dir-btn" data-dir="in">收到礼金</button>
            <button class="dir-btn on" data-dir="out">送出礼金</button>
          </div>
          <div class="amt-row">
            <span class="amt-cur">¥</span>
            <input id="amt" class="amt-in" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
          </div>
          <div class="chips" id="chips"></div>
        </div>

        <div id="giftFields">
          <div class="field">
            <span class="field-lb">谁</span>
            <input id="who" class="field-in" type="text" autocomplete="off" placeholder="选个人或输入新名字">
          </div>
          <div id="sug"></div>
          <div id="personCard"></div>
          <div class="field">
            <span class="field-lb">事由</span>
            <input id="evt" class="field-in" type="text" autocomplete="off" placeholder="可留空，如 周岁宴">
          </div>
          <div id="evtSug"></div>
        </div>

        <div id="babyFields" class="hidden">
          <div class="cat-grid" id="catGrid"></div>
          <div class="row2">
            <div class="field half">
              <span class="field-lb">数量</span>
              <input id="qty" class="field-in" type="text" inputmode="decimal" autocomplete="off" placeholder="选填">
              <span class="unit" id="unitLabel">罐</span>
            </div>
            <div class="field half">
              <span class="field-lb">商家</span>
              <input id="mer" class="field-in" type="text" autocomplete="off" placeholder="选填">
            </div>
          </div>
          <div class="field">
            <span class="field-lb">备注</span>
            <input id="note" class="field-in" type="text" autocomplete="off" placeholder="选填">
          </div>
        </div>

        <button id="btnSave" class="save">保 存</button>
        <button id="btnVoice" class="voice-btn" title="语音填写">语音填写</button>
      </div>

      <div class="list">
        <div class="list-h"><span class="list-t">最近动态</span><span class="link" id="lnkAll">全部时间线 ›</span></div>
        <div id="recent"></div>
      </div>
    </section>

    <!-- ---------- 往来 ---------- -->
    <section id="page-gift" class="page hidden">
      <div id="giftOverview"></div>
      <div class="list-h"><span class="list-t">按事由</span></div>
      <div id="giftByEvent"></div>
      <div class="list-h" style="margin-top:16px"><span class="list-t">全部往来</span></div>
      <div id="giftList"></div>
    </section>

    <!-- ---------- 成长 ---------- -->
    <section id="page-grow" class="page hidden">
      <div id="growOverview"></div>
      <div id="supplyBox"></div>
      <div class="list-h"><span class="list-t">成长里程碑</span><span class="link" id="lnkAddMs">＋ 记一笔成长</span></div>
      <div id="msList"></div>
      <div class="list-h" style="margin-top:16px"><span class="list-t">开销明细</span></div>
      <div id="babyList"></div>
      <div class="list-h" style="margin-top:16px"><span class="list-t">健康档案</span><span class="link" id="lnkAddHealth">＋ 记一笔</span></div>
      <div id="healthList"></div>
      <div class="list-h" style="margin-top:16px"><span class="list-t">生日与体检提醒</span><span class="link" id="lnkAddReminder">＋ 添加提醒</span></div>
      <div id="reminderList"></div>
    </section>

    <!-- ---------- 我的 ---------- -->
    <section id="page-me" class="page hidden">
      <div id="meBox"></div>
    </section>

    <!-- ---------- 家庭协作 ---------- -->
    <section id="page-family" class="page hidden">
      <div id="familyBox"></div>
    </section>
  </div>

  <!-- ---------- 底部导航 ---------- -->
  <nav class="tabbar" id="tabbar">
    <button class="tb on" data-p="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>首页</span>
    </button>
    <button class="tb" data-p="gift">
      <svg viewBox="0 0 24 24"><path d="M3 8h18v3H3zm2 4h14v9H5zm6-9h2v5h-2zM12 3c-1.5-1-4 0-4 3h2c0-1 1-1.4 2-1S13 5 13 6h2c0-3-1.5-4-3-3z"/></svg>
      <span>往来</span>
    </button>
    <button class="tb" data-p="grow">
      <svg viewBox="0 0 24 24"><path d="M12 21c4-4 5-8 5-11a5 5 0 0 0-10 0c0 3 1 7 5 11zm0-16a2 2 0 0 1 2 2h-4a2 2 0 0 1 2-2z"/></svg>
      <span>成长</span>
    </button>
    <button class="tb" data-p="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1-3.8 4-5.8 7.5-5.8s6.5 2 7.5 5.8z"/></svg>
      <span>我的</span>
    </button>
    <button class="tb" data-p="family">
      <svg viewBox="0 0 24 24"><path d="M4 20v-1.5A4.5 4.5 0 0 1 8.5 14h7a4.5 4.5 0 0 1 4.5 4.5V20M8.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7 0a3.5 3.5 0 1 0 0-7M16 14h1.5A3.5 3.5 0 0 1 21 17.5V20"/></svg>
      <span>家庭</span>
    </button>
  </nav>
</div>

<!-- ============ 弹层 ============ -->
<div id="sheetRoot" class="hidden">
  <div class="sheet-mask" id="sheetMask">
    <div class="sheet" id="sheetBody"></div>
  </div>
</div>

<div id="toastRoot"></div>

<script src="/app.js"></script>
<script src="/views.js"></script>
<script src="/features.js"></script>
</body>
</html>
