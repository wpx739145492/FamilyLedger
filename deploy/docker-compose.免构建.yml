# ============================================================
# 免构建 / 免镜像仓库版：直接用已编译好的二进制，挂进 alpine 跑
# 适用：不想装 Docker、不想配容器仓库、全程只点图形界面
#
# 用法（飞牛 NAS）：
#   1. 文件管理里建目录 /vol1/docker/familyledger/bin
#   2. 把 dist/familyledger-linux-amd64（ARM 机器用 -arm64）传进去，改名为 familyledger
#   3. Docker → Compose → 新增项目，粘贴本文件内容
#   4. 点「构建」，浏览器打开 http://NAS的IP:8080
#
# 注意：二进制是纯静态编译（CGO_ENABLED=0），不依赖 libc，alpine 可直接运行。
# 下面用 sh -c 先 chmod +x，是为了避免上传后文件权限不是可执行导致启动失败。
# ============================================================
services:
  familyledger:
    image: alpine:3.20
    container_name: familyledger
    restart: unless-stopped
    command: ["/bin/sh", "-c", "chmod +x /app/familyledger && exec /app/familyledger"]
    ports:
      - "8080:8080"
    volumes:
      - /vol1/docker/familyledger/bin:/app
      - /vol1/docker/familyledger/data:/data
      - /vol1/docker/familyledger/backup:/backup
    environment:
      - TZ=Asia/Shanghai
      - FL_DB=/data/familyledger.db
      - FL_ADDR=:8080
      # 6 位家庭口令，全家共用——上线前务必改掉
      - FL_SHARED_TOKEN=123456
      - FL_BACKUP_DIR=/backup
