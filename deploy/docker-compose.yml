# ============================================================
# 给飞牛 NAS 粘贴用的最终版（不含 build，纯拉镜像）
# 使用前把 image 换成你的实际仓库地址，FL_SHARED_TOKEN 换成 6 位家庭口令
# ============================================================
services:
  familyledger:
    image: registry.cn-hangzhou.aliyuncs.com/你的命名空间/familyledger:latest
    container_name: familyledger
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /vol1/docker/familyledger/data:/data
      - /vol1/docker/familyledger/backup:/backup
    environment:
      - TZ=Asia/Shanghai
      - FL_DB=/data/familyledger.db
      - FL_ADDR=:8080
      - FL_SHARED_TOKEN=123456
      - FL_BACKUP_DIR=/backup
